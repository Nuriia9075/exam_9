name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Поднимаем временную базу данных PostgreSQL на сервере GitHub
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: exam9_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Ждем, пока база данных полностью запустится
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Проверка исходного кода (Checkout)
      uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        # Ставим библиотеку для работы Django с PostgreSQL
        pip install psycopg2-binary 
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f source/requirements.txt ]; then pip install -r source/requirements.txt; fi

    - name: Проверка миграций базы данных Django
      env:
        # Передаем ваши точные переменные окружения для тестов
        SECRET_KEY: 'django-insecure-@_qiz6lnw#-#a5!l1ip7l7pvu2b4k#)n*f(@6f2o+ff$96-)_$'
        DEBUG: 'True'
        DB_NAME: 'exam9_db'
        DB_USER: 'postgres'
        DB_PASSWORD: 'postgres'
        DB_HOST: 'localhost'
        DB_PORT: '5432'
      run: |
        cd source
        python manage.py makemigrations --check --dry-run
        python manage.py migrate
