{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white fs-5 fw-bold">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>Предупреждение об удалении
            </div>
            <div class="card-body text-center py-4">
                <h4 class="card-title text-dark mb-3">Вы уверены, что хотите удалить эту фотографию?</h4>
                {% if object.image %}
                    <div class="mb-4">
                        <img src="{{ object.image.url }}" class="img-thumbnail object-fit-cover shadow-sm" style="max-height: 200px;" alt="{{ object.caption }}">
                        <p class="text-muted small mt-2 mb-0"><strong>Подпись:</strong> {{ object.caption }}</p>
                    </div>
                {% endif %}
                <p class="card-text text-secondary">
                    Это действие необратимо.
                </p>
                <hr>
                <form method="post" class="d-flex justify-content-center gap-3 mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="fa-regular fa-trash-can me-1"></i>Да, удалить
                    </button>
                    <a href="{% url 'albumApp:photo-detail' object.pk %}" class="btn btn-outline-secondary">
                        Отмена
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
