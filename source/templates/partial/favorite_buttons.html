{% if request.user.is_authenticated %}
    <div class="favorite-container mt-2">
        {% if request.user in item.favorite_users.all %}
            <button class="btn btn-sm btn-outline-primary fav-btn-add d-none"
                    data-key="favorite"
                    data-url="{{ api_url }}">
                <i class="fa-regular fa-star"></i>
            </button>

            <button class="btn btn-sm btn-danger fav-btn-remove"
                    data-key="favorite"
                    data-url="{{ api_url }}">
                <i class="fa-solid fa-star"></i>
            </button>
        {% else %}
            <button class="btn btn-sm btn-outline-primary fav-btn-add"
                    data-key="favorite"
                    data-url="{{ api_url }}">
                <i class="fa-regular fa-star"></i>
            </button>

            <button class="btn btn-sm btn-danger fav-btn-remove d-none"
                    data-key="favorite"
                    data-url="{{ api_url }}">
                <i class="fa-solid fa-star"></i>
            </button>
        {% endif %}
    </div>
{% endif %}
