<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
    {% for album in albums %}
        <div class="col">
            <a href="{% url 'albumApp:album-detail' album.pk %}" class="text-decoration-none text-dark">
                <div class="card h-100 shadow-sm hover-shadow border-secondary">
                    <div class="card-body d-flex flex-column justify-content-between py-4 text-center">
                        <div>
                            <i class="fa-solid fa-folder text-warning fs-1 mb-3"></i>
                            <h5 class="card-title fw-bold mb-1">{{ album.title }}</h5>
                            {% if album.description %}
                                <p class="card-text text-muted small text-truncate px-2">{{ album.description }}</p>
                            {% endif %}
                        </div>
                        <div class="mt-3">
                            {% if not album.is_public %}
                                <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 small">
                                    <i class="fa-solid fa-lock me-1"></i>Приватный
                                </span>
                            {% else %}
                                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 small">
                                    <i class="fa-solid fa-earth-americas me-1"></i>Публичный
                                </span>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </a>
        </div>
    {% empty %}
        <div class="col-12 text-center py-4">
            <p class="text-muted">пока нет доступных альбомов.</p>
        </div>
    {% endfor %}
</div>
